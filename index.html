<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title></title>
<style>
html,body{margin:0;padding:0}
body{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;background:#0b1020}
/* one body rule per theme, matching the .mp[data-theme] blocks below */
body:has(.mp[data-theme="dark"]){background:#0b1020}
</style>

<style id="mp-css">
.mp{
  color:var(--mp-ink); font-size:14px; line-height:1.4; box-sizing:border-box;
}
/* Themes: one block per theme, defining the --mp-* variables. Each color falls back to a host variable
   (--paper, --ink, ...) when the page that embeds the player defines one. --mp-playing, --mp-shadow and
   --mp-font have no host fallback and are used by full mode only. */
.mp[data-theme="dark"]{
  --mp-paper:var(--paper,#0b1020); --mp-panel:var(--panel,#131a33); --mp-ink:var(--ink,#dbe4ff);
  --mp-muted:var(--muted,#7080a8); --mp-line:var(--line,#243056); --mp-accent:var(--accent,#5b8cff);
  --mp-accent-ink:var(--accent-ink,#0b1020); --mp-warn:var(--warn,#E5806B); --mp-soft:var(--soft,#1b2447);
  --mp-playing:#ffd166; --mp-shadow:#050810;
  --mp-font:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  color-scheme:dark;
}
.mp *,.mp *::before,.mp *::after{box-sizing:border-box}
.mp [hidden]{display:none!important}
.mp .mp-btn{font:inherit;font-weight:600;border:1px solid var(--mp-line);background:var(--mp-panel);color:var(--mp-ink);padding:6px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:32px}
.mp .mp-btn:hover{border-color:var(--mp-accent)}
.mp .mp-btn.mp-sm{padding:3px 9px;font-size:13px;min-height:28px}
.mp .mp-btn.mp-pri{background:var(--mp-accent);border-color:var(--mp-accent);color:var(--mp-accent-ink)}
.mp .mp-btn.mp-x{color:var(--mp-warn)}
.mp .mp-btn:focus-visible,.mp input:focus-visible,.mp select:focus-visible{outline:2px solid var(--mp-accent);outline-offset:1px}
.mp input[type=url],.mp input[type=text],.mp select{font:inherit;color:var(--mp-ink);background:var(--mp-paper);border:1px solid var(--mp-line);border-radius:8px;padding:6px 10px;min-width:0;max-width:100%}
.mp input[type=url]{width:100%}
.mp input[type=range]{flex:1 1 120px;accent-color:var(--mp-accent);min-width:0}
.mp .mp-hint{color:var(--mp-muted);font-size:12px;margin:6px 0 0}
.mp .mp-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.mp .mp-sp{justify-content:space-between}
.mp .mp-grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* đang phát: ảnh bìa + tên bài + ca sĩ/nguồn/chất lượng */
.mp .mp-np{display:flex;gap:12px;align-items:center;margin-top:8px}
.mp .mp-cover{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;background:var(--mp-soft);display:block}
.mp.mp-full .mp-cover{width:72px;height:72px;border:2px solid var(--mp-line);border-radius:2px}
.mp .mp-np-t{min-width:0;flex:1}
.mp .mp-now{margin:0;overflow-wrap:anywhere;font-weight:700}
.mp.mp-full .mp-now{font-size:14px;font-weight:700;color:var(--mp-playing);text-transform:none;letter-spacing:normal}
.mp .mp-sub{color:var(--mp-muted);font-size:12px;overflow-wrap:anywhere;margin-top:2px}
.mp .mp-frame{position:relative}
.mp .mp-frame:empty{display:none}
.mp .mp-frame iframe{width:100%;border:0;border-radius:8px;display:block;height:120px}
.mp .mp-frame iframe.mp-hide{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.mp .mp-frame audio{width:100%;display:block}
/* playlist */
.mp .mp-pl{list-style:none;margin:4px 0 0;padding:0;max-height:260px;overflow:auto}
.mp .mp-pl li{display:flex;gap:6px;align-items:center;border-top:1px dashed var(--mp-line);padding:4px 0}
.mp .mp-pl-name{flex:1;min-width:0;display:flex;gap:8px;align-items:center;text-align:left;background:none;border:0;color:var(--mp-ink);font:inherit;font-size:13px;cursor:pointer;padding:2px}
.mp .mp-th{width:38px;height:38px;border-radius:6px;overflow:hidden;flex:none;background:var(--mp-soft);display:flex;align-items:center;justify-content:center;color:var(--mp-muted)}
.mp .mp-th img{width:100%;height:100%;object-fit:cover;display:block}
.mp .mp-pl-txt{min-width:0;display:flex;flex-direction:column}
.mp .mp-pl-t,.mp .mp-pl-s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp .mp-pl-s{font-size:11px;color:var(--mp-muted)}
.mp .mp-pl li.mp-cur .mp-pl-t{font-weight:700;color:var(--mp-accent)}
.mp .mp-pl li.mp-cur .mp-pl-t::before{content:"▶ "}
.mp .mp-pl-ed{flex:1;min-width:0;display:flex;gap:6px;flex-wrap:wrap}
.mp .mp-pl-in{flex:1 1 120px}
.mp .mp-toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%) translateY(10px);background:var(--mp-ink);color:var(--mp-paper);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:1000;max-width:calc(100vw - 32px)}
.mp .mp-toast.mp-on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.mp .mp-toast{transition:none}}
/* mode mini */
.mp.mp-mini{position:relative;display:inline-flex;align-items:center}
.mp.mp-mini .mp-mini-play{border-radius:8px 0 0 8px;border-right-width:0;min-width:38px;padding-left:8px;padding-right:8px}
.mp.mp-mini .mp-mini-play.mp-on{background:var(--mp-accent);border-color:var(--mp-accent);color:var(--mp-accent-ink)}
.mp.mp-mini .mp-tog{border-radius:0 8px 8px 0}
.mp.mp-mini .mp-body{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:340px;max-width:calc(100vw - 32px);background:var(--mp-panel);border:1px solid var(--mp-line);border-radius:12px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.mp.mp-mini.mp-closed .mp-body{width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;padding:0;border:0}
@media (max-width:600px){.mp.mp-mini:not(.mp-closed) .mp-body{position:fixed;left:16px;right:16px;width:auto;max-width:none;top:calc(env(safe-area-inset-top,0px) + 64px);max-height:calc(100dvh - 90px);overflow:auto}}
.mp.mp-mini .mp-head,.mp.mp-mini .mp-big{display:none}
/* mode full */
/* full page: the fixed theme wins over host variables (initial makes var() use its fallback) */
.mp.mp-full{--paper:initial;--panel:initial;--ink:initial;--muted:initial;--line:initial;--accent:initial;--accent-ink:initial;--warn:initial;--soft:initial}
/* full mode: retro gamer + minimalism (hard 3px shadows, 2px borders, 2px corners, mono font) */
.mp.mp-full{display:block;min-height:100vh;min-height:100dvh;background:var(--mp-paper);font-family:var(--mp-font);font-size:13px;line-height:1.45;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.mp.mp-full .mp-mini-play,.mp.mp-full .mp-tog{display:none}
.mp.mp-full .mp-body{max-width:560px;min-width:0;margin:0 auto;background:var(--mp-panel);border:2px solid var(--mp-line);border-radius:2px;padding:16px;box-shadow:3px 3px 0 var(--mp-shadow)}
.mp.mp-full .mp-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 4px;padding-bottom:10px;border-bottom:2px solid var(--mp-line)}
.mp.mp-full .mp-head h1{margin:0;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mp-accent)}
.mp.mp-full .mp-big{display:flex;justify-content:center;gap:12px;margin:16px 0 4px}
.mp.mp-full .mp-big .mp-btn{min-width:56px;min-height:48px;font-size:18px}
/* buttons: hard shadow, press = sink 2px and the shadow shrinks */
.mp.mp-full .mp-btn{font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--mp-line);border-radius:2px;background:var(--mp-panel);color:var(--mp-ink);padding:5px 12px;min-height:36px;box-shadow:3px 3px 0 var(--mp-shadow)}
.mp.mp-full .mp-btn:hover{border-color:var(--mp-accent)}
.mp.mp-full .mp-btn:active{transform:translateY(2px);box-shadow:3px 1px 0 var(--mp-shadow)}
.mp.mp-full .mp-btn.mp-sm{font-size:11px;padding:3px 9px;min-height:32px}
.mp.mp-full .mp-btn.mp-pri{background:var(--mp-accent);border-color:var(--mp-accent);color:var(--mp-accent-ink)}
.mp.mp-full .mp-btn.mp-pri:hover{border-color:var(--mp-ink)}
.mp.mp-full .mp-btn.mp-x{color:var(--mp-warn)}
/* inputs, labels, hints */
.mp.mp-full input[type=url],.mp.mp-full input[type=text],.mp.mp-full select{font:inherit;font-size:13px;color:var(--mp-ink);background:var(--mp-paper);border:2px solid var(--mp-line);border-radius:2px;padding:6px 10px;min-height:36px;text-transform:none}
.mp.mp-full input::placeholder{color:var(--mp-muted);opacity:1}
.mp.mp-full label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mp-muted)}
.mp.mp-full .mp-sp strong{letter-spacing:.1em;text-transform:uppercase}
.mp.mp-full .mp-row{gap:10px;margin-top:12px}
.mp.mp-full .mp-hint{font-size:11px;line-height:1.5;margin:10px 0 0;text-transform:none;letter-spacing:normal}
/* keyboard focus: clear accent outline on every control */
.mp.mp-full .mp-btn:focus-visible,.mp.mp-full .mp-pl-name:focus-visible,.mp.mp-full input:focus-visible,.mp.mp-full select:focus-visible,.mp.mp-full audio:focus-visible{outline:2px solid var(--mp-accent);outline-offset:2px}
.mp.mp-full input:focus-visible,.mp.mp-full select:focus-visible{border-color:var(--mp-accent)}
/* optional scanlines: off by default, enabled by data-scanlines="on" on the root element (no UI toggle) */
.mp.mp-full[data-scanlines="on"]::after{content:"";position:fixed;inset:0;z-index:900;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.16) 0,rgba(0,0,0,.16) 1px,transparent 1px,transparent 3px)}
@keyframes mp-blink{0%,49.9%{opacity:1}50%,100%{opacity:0}}
/* now playing */
.mp.mp-full .mp-np{margin-top:12px;padding:10px;background:var(--mp-paper);border:2px solid var(--mp-line);border-radius:2px}
.mp.mp-full .mp-sub{font-size:11px;color:var(--mp-muted);text-transform:none;letter-spacing:normal}
/* cursor: steady while paused, blinking while playing (the hidden .mp-mini-play gets .mp-on when playing) */
.mp.mp-full .mp-now::before{content:"▮";content:"▮" / "";display:inline-block;margin-right:.5em;color:var(--mp-playing)}
.mp.mp-full .mp-mini-play.mp-on ~ .mp-body .mp-now::before,.mp.mp-full .mp-mini-play.mp-on ~ .mp-body .mp-pl li.mp-cur .mp-pl-t::before{animation:mp-blink 1s steps(1,end) infinite}
@media (prefers-reduced-motion:reduce){.mp.mp-full .mp-mini-play.mp-on ~ .mp-body .mp-now::before,.mp.mp-full .mp-mini-play.mp-on ~ .mp-body .mp-pl li.mp-cur .mp-pl-t::before{animation:none}}
/* players */
.mp.mp-full .mp-frame{margin-top:12px}
.mp.mp-full .mp-frame audio{height:40px;color-scheme:dark;background:var(--mp-paper);border:2px solid var(--mp-line);border-radius:2px;box-shadow:3px 3px 0 var(--mp-shadow)}
.mp.mp-full .mp-frame iframe:not(.mp-hide){border:2px solid var(--mp-line);border-radius:2px;box-shadow:3px 3px 0 var(--mp-shadow)}
/* volume: segmented bar like a health bar; --mp-fill (0-100%) is set by script */
.mp.mp-full input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:20px;min-height:0;margin:0;padding:0;border:0;cursor:pointer}
.mp.mp-full input[type=range]::-webkit-slider-runnable-track{box-sizing:border-box;height:16px;border:2px solid var(--mp-line);border-radius:2px;background:repeating-linear-gradient(90deg,transparent 0 8px,var(--mp-panel) 8px 10px),linear-gradient(90deg,var(--mp-accent) var(--mp-fill,0%),var(--mp-paper) var(--mp-fill,0%))}
.mp.mp-full input[type=range]::-moz-range-track{box-sizing:border-box;height:16px;border:2px solid var(--mp-line);border-radius:2px;background:repeating-linear-gradient(90deg,transparent 0 8px,var(--mp-panel) 8px 10px),linear-gradient(90deg,var(--mp-accent) var(--mp-fill,0%),var(--mp-paper) var(--mp-fill,0%))}
.mp.mp-full input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;box-sizing:border-box;width:6px;height:16px;margin-top:-2px;border:0;border-radius:0;background:var(--mp-ink)}
.mp.mp-full input[type=range]::-moz-range-thumb{box-sizing:border-box;width:6px;height:16px;border:0;border-radius:0;background:var(--mp-ink)}
/* playlist */
.mp.mp-full .mp-pl{margin-top:8px;padding:0 8px;max-height:min(50vh,420px);background:var(--mp-paper);border:2px solid var(--mp-line);border-radius:2px;scrollbar-width:thin;scrollbar-color:var(--mp-line) var(--mp-paper)}
.mp.mp-full .mp-pl:empty{display:none}
.mp.mp-full .mp-pl li{border-top:2px solid var(--mp-line);padding:6px 0}
.mp.mp-full .mp-pl li:first-child{border-top:0}
.mp.mp-full .mp-pl-name{font-size:13px}
.mp.mp-full .mp-pl-name:hover{background:var(--mp-soft)}
.mp.mp-full .mp-th{width:36px;height:36px;border:2px solid var(--mp-line);border-radius:2px}
.mp.mp-full .mp-pl-t,.mp.mp-full .mp-pl-s,.mp.mp-full .mp-pl-in{text-transform:none;letter-spacing:normal}
.mp.mp-full .mp-pl-s{font-size:11px;color:var(--mp-muted)}
.mp.mp-full .mp-pl li.mp-cur .mp-pl-t{font-weight:700;color:var(--mp-playing)}
.mp.mp-full .mp-pl li.mp-cur .mp-pl-t::before{content:"▮";content:"▮" / "";margin-right:.5em;color:var(--mp-playing)}
/* toast */
.mp.mp-full .mp-toast{font-size:12px;color:var(--mp-ink);background:var(--mp-panel);border:2px solid var(--mp-accent);border-radius:2px;box-shadow:3px 3px 0 var(--mp-shadow)}
/* small screens (down to about 360px): tighter spacing, no horizontal overflow */
@media (max-width:420px){
  .mp.mp-full{padding-left:10px;padding-right:10px}
  .mp.mp-full .mp-body{padding:12px}
  .mp.mp-full .mp-cover{width:56px;height:56px}
  .mp.mp-full .mp-big{gap:8px}
  .mp.mp-full .mp-big .mp-btn{flex:1 1 0;min-width:48px;max-width:96px}
  .mp.mp-full .mp-head h1{letter-spacing:.1em}
  .mp.mp-full input[type=url],.mp.mp-full input[type=text],.mp.mp-full select{font-size:16px}
}
</style>
</head>
<body>
<div id="app"></div>

<script id="mp-js">
/* Personal Music Player — a single global: window.MusicPlayer
   Usage: MusicPlayer.mount(el, {mode:'full'|'mini', lang:<key of I18N>, theme:<name in THEMES>}) */
(function(){
  'use strict';
  var KEY = 'musicplayer-v1';
  var YT_ORIGIN = 'https://www.youtube.com';
  var SLEEP_OPTS = [0,15,30,45,60,90];
  var AUDIO_RE = /\.(mp3|m4a|aac|ogg|oga|opus|wav|webm|flac)(\?|#|$)/i;
  var DRIVE_RE = /drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=)([A-Za-z0-9_-]{20,})/;
  var SC_RE = /^https?:\/\/(?:www\.|m\.|on\.)?soundcloud\.com\/[^\s]+/i;

  /* All UI text lives in I18N; English is the base language. To add a language, add a block such as
     I18N.vi = {...}. Keys missing from a language fall back to en, then to the key name itself. */
  var I18N = {
    en:{ph:'Paste a YouTube, SoundCloud, mp3 or Google Drive link',play:'▶ Play',stop:'■ Stop',add:'+ Add',bad:'Invalid link',
        pl:'Playlist',empty:'No tracks yet.',rename:'Edit title / artist',remove:'Remove from playlist',added:'Added to playlist',dup:'This link is already in the playlist',
        ttl:'Title',artist:'Artist',
        vol:'🔊 Volume',sleep:'⏾ Sleep timer',off:'Off',min:'min',left:'stops in {m} min',slept:'Music paused by the sleep timer',
        pause:'Pause',resume:'Play',prev:'Previous track',next:'Next track',collapse:'Collapse',expand:'Expand',
        exp:'⤓ Export JSON',imp:'⤒ Import JSON',impOk:'Imported {n} new tracks',impBad:'Invalid JSON file',
        open:'Open original link',scFail:'Could not load SoundCloud',
        blocked:'Browser blocked autoplay, press ▶',
        title:'Music Player',heading:'♪ Music Player',menu:'♪ Music',link:'↗ Link',site:'Link',yt:'YouTube',sc:'SoundCloud',gd:'Google Drive',
        hint:'The playlist is stored in this browser. To use it elsewhere: Export JSON here, then Import JSON there. Title, artist and cover are fetched when you add a track (set them yourself with ✎ for Drive). Quality can only be estimated for direct mp3 links. Drive: share with “Anyone with the link”. iPhone lock screen: only direct mp3 links keep playing.'}
  };

  /* Themes: add a CSS block .mp[data-theme="name"] and the name here. Unknown names fall back to 'dark'. */
  var THEMES = ['dark'];
  function normLang(l){ return typeof l==='string' && Object.prototype.hasOwnProperty.call(I18N, l) ? l : 'en'; }
  function normTheme(x){ return THEMES.indexOf(x)>=0 ? x : 'dark'; }

  /* ---------- state (localStorage) ---------- */
  function safeThumb(s){ return typeof s==='string' && /^(https?:\/\/|data:image\/)/i.test(s) ? s : ''; }
  function pick(x){ return {id:x.id, url:x.url, name:x.name, artist:x.artist, thumb:x.thumb, quality:x.quality, m:x.m?1:0}; }
  function loadState(){
    var s = {}; try{ s = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){}
    var list = Array.isArray(s.list) ? s.list.filter(function(x){ return x && typeof x.url==='string'; }) : [];
    return {list:list.map(function(x){ return {id:x.id||newId(), url:x.url, name:String(x.name||''), artist:String(x.artist||''), thumb:safeThumb(x.thumb), quality:String(x.quality||''), m:x.m?1:0}; }),
            idx:typeof s.idx==='number'?s.idx:-1, vol:typeof s.vol==='number'?s.vol:80, plOpen:s.plOpen!==false,
            url:typeof s.url==='string'?s.url:'', lang:s.lang, theme:s.theme};
  }
  function newId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  var S = loadState();
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify({v:1,list:S.list.map(pick),idx:S.idx,vol:S.vol,plOpen:S.plOpen,url:S.url,lang:S.lang,theme:S.theme})); }catch(e){} }

  /* ---------- url helpers ---------- */
  function ytId(u){ var m = String(u||'').match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/live\/|\/shorts\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : null; }
  function driveId(u){ var m = String(u||'').match(DRIVE_RE); return m ? m[1] : null; }
  function isSc(u){ return SC_RE.test(String(u||'')); }
  function playable(u){ u = String(u||''); return !!(ytId(u) || driveId(u) || isSc(u) || (/^https?:\/\//i.test(u) && AUDIO_RE.test(u))); }
  function dupKey(u){
    var y = ytId(u), d = driveId(u); u = String(u).trim();
    if(y) return 'yt:'+y; if(d) return 'gd:'+d;
    if(isSc(u)) u = u.replace(/[?#].*$/, '');
    return u.replace(/\/$/,'').toLowerCase();
  }
  function siteOf(u){
    if(ytId(u)) return t('yt');
    if(isSc(u)) return t('sc');
    if(/drive\.google\.com/.test(u)) return t('gd');
    try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return t('site'); }
  }
  function baseTitle(u){
    var y = ytId(u); if(y) return y;
    var d = driveId(u); if(d) return d.slice(0,8)+'…';
    try{
      var p = new URL(u).pathname.split('/').filter(Boolean);
      if(isSc(u)) return decodeURIComponent(p.slice(-2).join(' / ')) || u;
      return decodeURIComponent(p.pop()||'') || u;
    }catch(e){ return u; }
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function subOf(i){ return [i.artist, siteOf(i.url), i.quality].filter(Boolean).join(' · '); }

  /* ---------- metadata: tên bài, ca sĩ, ảnh bìa, chất lượng ---------- */
  var META_FIELDS = ['name','artist','thumb','quality'];
  function fill(info, m){
    var ch = false;
    META_FIELDS.forEach(function(k){ if(m && m[k] && !info[k]){ info[k] = m[k]; ch = true; } });
    return ch;
  }
  function cleanArtist(a){ return String(a||'').replace(/\s*-\s*Topic$/i,'').trim(); }
  function getJson(url){ return fetch(url).then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); }); }
  function cat(chunks, n){ var u8 = new Uint8Array(n), o = 0; chunks.forEach(function(c){ u8.set(c,o); o += c.length; }); return u8; }
  /* đọc phần đầu file mp3 (đủ cho thẻ ID3), không cần header Range nên không bị preflight CORS */
  function fetchHead(u){
    return fetch(u).then(function(r){
      if(!r.ok || !r.body || !r.body.getReader) throw new Error('nobody');

      var i = curInfo(), title = nowTitle();
      navigator.mediaSession.metadata = title ? new MediaMetadata({title:title, artist:i.artist || siteOf(i.url), album:t('title'), artwork:i.thumb ? [{src:i.thumb}] : []}) : null;
      var h = {play:function(){ if(!MP.playing) toggle(); }, pause:function(){ if(MP.playing) pause(); }, previoustrack:function(){ step(-1); }, nexttrack:function(){ step(1); }};
      Object.keys(h).forEach(function(k){ try{ navigator.mediaSession.setActionHandler(k, h[k]); }catch(e){} });
    }catch(e){}
  }

  /* ---------- controls ---------- */
  function pause(){
    if(MP.kind==='audio' && MP.el) MP.el.pause();
    else if(MP.kind==='yt'){ ytCmd('pauseVideo'); MP.playing=false; updPlay(); }
    else if(MP.kind==='sc' && MP.sc) MP.sc.pause();
    else if(MP.kind==='drive' || MP.kind==='sc') clearPlayer();
  }
  function toggle(){
    if(MP.kind==='audio' && MP.el){ if(MP.el.paused) tryPlay(MP.el); else MP.el.pause(); return; }
    if(MP.kind==='yt'){ ytCmd(MP.playing?'pauseVideo':'playVideo'); MP.playing=!MP.playing; updPlay(); return; }
    if(MP.kind==='sc' && MP.sc){ MP.sc.toggle(); return; }
    if(MP.kind){ clearPlayer(); renderNow(); return; }
    if(S.list.length) playItem(S.idx>=0 ? S.idx : 0); else playPasted();
  }
  function playPasted(){
    var u = S.url; MP.item = null;
    var info = {url:u, name:'', artist:'', thumb:'', quality:'', m:0};
    if(playUrl(u)){ MP.pasted = info; enrich(info); } else MP.pasted = null;
    renderNow(); renderPlaylist();
  }
  function playItem(i){
    var L = S.list; if(!L.length) return;
    i = ((i % L.length) + L.length) % L.length;
    var it = L[i]; S.idx = i; MP.item = it.id; MP.pasted = null; save();
    if(playUrl(it.url)) enrich(it);
    renderNow(); renderPlaylist(); q('link').href = it.url;
  }
  function step(d){
    var L = S.list; if(!L.length) return;
    var c = L.findIndex(function(x){ return x.id===MP.item; });
    playItem(c>=0 ? c+d : (d>0 ? 0 : L.length-1));
  }
  function addTrack(u, name, silent, extra){
    u = String(u||'').trim();
    if(!playable(u)){ if(!silent) toast(t('bad')); return false; }
    var k = dupKey(u);
    if(S.list.some(function(x){ return dupKey(x.url)===k; })){ if(!silent) toast(t('dup')); return false; }
    var it = {id:newId(), url:u, name:String(name||'').trim(), artist:'', thumb:'', quality:'', m:0};
    if(extra){
      if(typeof extra.artist==='string') it.artist = extra.artist.trim();
      it.thumb = safeThumb(extra.thumb);
      if(typeof extra.quality==='string') it.quality = extra.quality;
      if(extra.m) it.m = 1;
    }
    var ps = MP.pasted;
    if(ps && dupKey(ps.url)===k){
      META_FIELDS.forEach(function(f){ if(!it[f] && ps[f]) it[f] = ps[f]; });
      if(ps.m) it.m = 1;
      it._size = ps._size; it._dur = ps._dur;
    }
    S.list.push(it);
    if(!silent){ S.plOpen = true; save(); renderPlaylist(); toast(t('added')); enrich(it); }
    return true;
  }
  function setVol(v){
    S.vol = Math.max(0, Math.min(100, +v||0)); save();
    if(R){ q('vol').value = S.vol; q('vol').style.setProperty('--mp-fill', S.vol+'%'); q('volV').textContent = S.vol+'%'; }
    if(MP.kind==='audio' && MP.el) MP.el.volume = S.vol/100;
    if(MP.kind==='sc' && MP.sc) MP.sc.setVolume(S.vol);
    ytCmd('setVolume',[S.vol]);
  }
  /* hẹn giờ tắt: không lưu, reload trang là reset */
  function sleepCheck(){
    if(sleepAt && Date.now()>=sleepAt){ sleepAt = 0; clearInterval(sleepTick); pause(); if(R) q('sleep').value = '0'; toast(t('slept')); }
    if(R) q('sleepLeft').textContent = sleepText();
    updPlay();
  }
  function setSleep(m){ clearInterval(sleepTick); sleepAt = m ? Date.now()+m*60000 : 0; if(m) sleepTick = setInterval(sleepCheck, 5000); sleepCheck(); }

  /* ---------- Xuất / Nhập JSON: {"app":"music-player","v":1,"list":[{url,name,artist,thumb,quality}]} ---------- */
  function exportData(){ return {app:'music-player', v:1, exported:new Date().toISOString(), list:S.list.map(function(x){ return {url:x.url, name:x.name, artist:x.artist, thumb:x.thumb, quality:x.quality, m:x.m?1:0}; })}; }
  function exportFile(){
    var blob = new Blob([JSON.stringify(exportData(), null, 2)], {type:'application/json'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'playlist-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }
  /* nhận: định dạng trên hoặc mảng [{url,name}]. File cũ (chưa có artist/thumb) vẫn nhập được. Gộp, bỏ bài trùng. */
  function importData(data){
    if(typeof data==='string'){ try{ data = JSON.parse(data); }catch(e){ return -1; } }
    var arr = Array.isArray(data) ? data : data && Array.isArray(data.list) ? data.list : null;
    if(!arr) return -1;
    var n = 0;
    arr.forEach(function(x){
      if(x && typeof x==='object'){ if(addTrack(x.url, x.name, true, x)) n++; }
      else if(typeof x==='string' && addTrack(x, '', true)) n++;
    });
    S.plOpen = true; save(); renderPlaylist(); enrichMissing();
    return n;
  }

  /* ---------- events ---------- */
  function onClick(e){
    var n = e.target.closest && e.target.closest('[data-mp]'); n = n && R.contains(n) ? n.getAttribute('data-mp') : '';
    if(n==='mini' || n==='bplay') return toggle();
    if(n==='tog'){ O.open = !O.open; return applyAll(); }
    if(n==='play') return playPasted();
    if(n==='stop'){ MP.item = null; MP.pasted = null; clearPlayer(); renderNow(); return renderPlaylist(); }
    if(n==='add') return addTrack(S.url);
    if(n==='prev' || n==='bprev') return step(-1);
    if(n==='next' || n==='bnext') return step(1);
    if(n==='plTog'){ S.plOpen = !S.plOpen; save(); return renderPlaylist(); }
    if(n==='exp') return exportFile();
    if(n==='imp') return q('file').click();
    var p = e.target.closest('[data-i]'), ed = e.target.closest('[data-ed]'), d = e.target.closest('[data-del]');
    if(p) return playItem(+p.dataset.i);
    if(ed){ MP.edit = S.list[+ed.dataset.ed].id; return renderPlaylist(); }
    if(d){
      var it = S.list.splice(+d.dataset.del, 1)[0]; if(!it) return;
      if(MP.item===it.id){ MP.item = null; clearPlayer(); renderNow(); }
      S.idx = S.list.findIndex(function(x){ return x.id===MP.item; });
      save(); renderPlaylist();
    }
  }
  function commitRename(inp, keep){
    var li = inp.closest('li'), ti = li && li.querySelector('[data-in]'), ar = li && li.querySelector('[data-ar]');
    MP.edit = null;
    var it = ti ? S.list[+ti.dataset.in] : null;
    if(it && keep){ it.name = ti.value.trim(); it.artist = ar ? ar.value.trim() : it.artist; save(); }
    renderPlaylist(); renderNow();
  }
  function onKey(e){
    if(e.target.classList.contains('mp-pl-in')){
      if(e.key==='Enter'){ e.preventDefault(); commitRename(e.target, true); }
      else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); commitRename(e.target, false); }
    } else if(e.target===q('url') && e.key==='Enter'){ e.preventDefault(); playPasted(); }
    else if(e.key==='Escape' && O.mode==='mini' && O.open){ O.open = false; applyAll(); q('tog').focus(); }
  }
  function onFocusOut(e){
    if(!e.target.classList.contains('mp-pl-in') || MP.edit===null) return;
    var li = e.target.closest('li');
    if(li && e.relatedTarget && li.contains(e.relatedTarget)) return;
    commitRename(e.target, true);
  }
  function onInput(e){
    if(e.target===q('url')){ S.url = e.target.value.trim(); save(); q('link').href = linkHref(); }
    else if(e.target===q('vol')) setVol(e.target.value);
  }
  function onChange(e){
    if(e.target===q('sleep')) setSleep(+e.target.value);
    else if(e.target===q('file')){
      var f = e.target.files && e.target.files[0]; e.target.value = ''; if(!f) return;
      f.text().then(function(txt){ var n = importData(txt); toast(n<0 ? t('impBad') : t('impOk').replace('{n}', n)); });
    }
  }
  function onImgErr(e){ var el = e.target; if(el && el.tagName==='IMG') el.hidden = true; }
  function onDocClick(e){ if(R && O.mode==='mini' && O.open && e.composedPath().indexOf(R)<0){ O.open = false; applyAll(); } }

  function unmount(){
    if(!R) return;
    clearPlayer();
    ['click','keydown','input','change'].forEach(function(ev,i){ R.removeEventListener(ev, [onClick,onKey,onInput,onChange][i]); });
    R.removeEventListener('focusout', onFocusOut);
    R.removeEventListener('error', onImgErr, true);
    document.removeEventListener('click', onDocClick);
    window.removeEventListener('message', onMessage);
    R.innerHTML = '';
    ['mp','mp-mini','mp-full','mp-closed'].forEach(function(c){ R.classList.remove(c); });
    R.removeAttribute('data-theme');
    R = null;
  }
  function mount(el, opts){
    if(typeof el==='string') el = document.querySelector(el);
    if(!el) throw new Error('MusicPlayer.mount: element not found');
    unmount(); MP.edit = null; MP.item = null; MP.pasted = null;
    opts = opts || {};
    O = {mode: opts.mode==='mini' ? 'mini' : 'full',
         lang: normLang(opts.lang!=null ? opts.lang : S.lang),
         theme: normTheme(opts.theme!=null ? opts.theme : S.theme),
         open:false};
    R = el; R.classList.add('mp', 'mp-'+O.mode); R.innerHTML = HTML;
    R.addEventListener('click', onClick); R.addEventListener('keydown', onKey); R.addEventListener('input', onInput);
    R.addEventListener('change', onChange); R.addEventListener('focusout', onFocusOut);
    R.addEventListener('error', onImgErr, true);
    document.addEventListener('click', onDocClick);
    window.addEventListener('message', onMessage);
    q('sleep').value = '0';
    applyAll();
    clearTimeout(tmp); tmp = setTimeout(enrichMissing, 300);
    return api;
  }

  var api = {
    mount: mount, unmount: unmount,
    play: function(){ if(!MP.playing) toggle(); }, pause: pause, toggle: toggle,
    next: function(){ step(1); }, prev: function(){ step(-1); },
    add: function(url, name){ return addTrack(url, name); },
    setLang: function(l){ O.lang = normLang(l); applyAll(); },
    setTheme: function(th){ O.theme = normTheme(th); applyTheme(); },
    setVolume: setVol, setSleep: setSleep,
    exportJSON: function(){ return JSON.stringify(exportData(), null, 2); },
    importJSON: function(x){ return importData(x); },
    getList: function(){ return S.list.map(function(x){ return {url:x.url, name:x.name, artist:x.artist, thumb:x.thumb, quality:x.quality}; }); },
    state: function(){ return {playing:MP.playing, kind:MP.kind, name:nowTitle()}; },
    version: '1.2.0'
  };
  window.MusicPlayer = api;
})();
</script>

<script>
MusicPlayer.mount(document.getElementById('app'), {mode:'full'});
</script>
</body>
